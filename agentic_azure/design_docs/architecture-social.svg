<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#0B1220"/>

  <!-- Title -->
  <text x="960" y="76" text-anchor="middle" font-size="46" font-weight="800" fill="#F8FAFC">Custom Agentic AI Platform</text>
  <text x="960" y="116" text-anchor="middle" font-size="20" fill="#94A3B8">Azure AKS + SGLang · built portable for on-prem from day one</text>

  <!-- Badge -->
  <rect x="1572" y="50" width="288" height="42" rx="21" fill="#052E22" stroke="#34D399" stroke-width="1.5"/>
  <text x="1716" y="77" text-anchor="middle" font-size="15" font-weight="700" fill="#34D399">100% open-source stack</text>
  <rect x="60" y="50" width="288" height="42" rx="21" fill="#172554" stroke="#818CF8" stroke-width="1.5"/>
  <text x="204" y="77" text-anchor="middle" font-size="15" font-weight="700" fill="#A5B4FC">No vendor lock-in</text>

  <!-- Clients -->
  <rect x="120" y="148" width="1680" height="74" rx="16" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <g font-size="17" font-weight="700" fill="#E2E8F0">
    <rect x="240" y="162" width="440" height="46" rx="23" fill="#1E293B" stroke="#475569"/>
    <text x="460" y="192" text-anchor="middle">Web &amp; Mobile</text>
    <rect x="740" y="162" width="440" height="46" rx="23" fill="#1E293B" stroke="#475569"/>
    <text x="960" y="192" text-anchor="middle">Partner APIs</text>
    <rect x="1240" y="162" width="440" height="46" rx="23" fill="#1E293B" stroke="#475569"/>
    <text x="1460" y="192" text-anchor="middle">Internal Systems</text>
  </g>
  <line x1="960" y1="222" x2="960" y2="242" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Gateway -->
  <rect x="120" y="246" width="1680" height="76" rx="16" fill="#0F172A" stroke="#FB923C" stroke-width="2"/>
  <text x="160" y="280" font-size="22" font-weight="800" fill="#FB923C">Agent Gateway</text>
  <text x="160" y="306" font-size="14" fill="#94A3B8">OIDC authn/z · quotas &amp; rate limits · routing · token &amp; cost metering · audit — the single front door</text>
  <line x1="960" y1="322" x2="960" y2="342" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Control plane -->
  <rect x="120" y="346" width="1680" height="156" rx="16" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
  <text x="160" y="376" font-size="15" font-weight="800" fill="#818CF8" letter-spacing="2">AGENTIC CONTROL PLANE</text>
  <g>
    <rect x="161" y="390" width="380" height="96" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="181" y="420" font-size="17" font-weight="700" fill="#F8FAFC">Orchestrator</text>
    <text x="181" y="444" font-size="12.5" fill="#94A3B8">plan → act → observe · Temporal durable runs</text>
    <text x="181" y="464" font-size="12.5" fill="#94A3B8">human-in-the-loop approvals</text>

    <rect x="567" y="390" width="380" height="96" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="587" y="420" font-size="17" font-weight="700" fill="#F8FAFC">MCP Tools</text>
    <text x="587" y="444" font-size="12.5" fill="#94A3B8">open tool standard · registry</text>
    <text x="587" y="464" font-size="12.5" fill="#94A3B8">gVisor sandboxes for untrusted code</text>

    <rect x="973" y="390" width="380" height="96" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="993" y="420" font-size="17" font-weight="700" fill="#F8FAFC">Memory &amp; RAG</text>
    <text x="993" y="444" font-size="12.5" fill="#94A3B8">hybrid search + rerank</text>
    <text x="993" y="464" font-size="12.5" fill="#94A3B8">episodic + semantic memory</text>

    <rect x="1379" y="390" width="380" height="96" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="1399" y="420" font-size="17" font-weight="700" fill="#F8FAFC">Guardrails &amp; Evals</text>
    <text x="1399" y="444" font-size="12.5" fill="#94A3B8">OPA policies · injection checks</text>
    <text x="1399" y="464" font-size="12.5" fill="#94A3B8">regression gates in CI</text>
  </g>
  <line x1="960" y1="502" x2="960" y2="520" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/>

  <!-- NATS -->
  <rect x="120" y="524" width="1680" height="48" rx="14" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
  <text x="960" y="555" text-anchor="middle" font-size="16" font-weight="700" fill="#FBBF24">NATS JetStream — event backbone · agent events · async tool results · webhooks</text>
  <line x1="960" y1="572" x2="960" y2="590" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Serving -->
  <rect x="120" y="594" width="1680" height="188" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <text x="160" y="624" font-size="15" font-weight="800" fill="#34D399" letter-spacing="2">MODEL SERVING — SGLang (OpenAI-compatible API)</text>
  <rect x="160" y="638" width="1600" height="42" rx="10" fill="#0F2A1F" stroke="#34D399"/>
  <text x="960" y="665" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">sgl-router — cache-aware load balancing (RadixAttention prefix locality)</text>
  <g>
    <rect x="160" y="694" width="520" height="74" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="184" y="722" font-size="17" font-weight="700" fill="#F8FAFC">Agent / Chat LLMs</text>
    <text x="184" y="748" font-size="12.5" fill="#94A3B8">8×H100/H200 · NVLink · FP8 · KEDA autoscaling</text>

    <rect x="700" y="694" width="520" height="74" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="724" y="722" font-size="17" font-weight="700" fill="#F8FAFC">Large Reasoning</text>
    <text x="724" y="748" font-size="12.5" fill="#94A3B8">multi-node tensor parallelism over InfiniBand</text>

    <rect x="1240" y="694" width="520" height="74" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="1264" y="722" font-size="17" font-weight="700" fill="#F8FAFC">Embeddings · VLMs</text>
    <text x="1264" y="748" font-size="12.5" fill="#94A3B8">smaller GPU pool · batched serving for RAG</text>
  </g>
  <line x1="960" y1="782" x2="960" y2="800" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Data plane -->
  <rect x="120" y="804" width="1680" height="104" rx="16" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
  <text x="160" y="834" font-size="15" font-weight="800" fill="#C084FC" letter-spacing="2">DATA PLANE — self-hosted &amp; portable</text>
  <g>
    <rect x="160" y="842" width="385" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="352" y="863" text-anchor="middle" font-size="14.5" font-weight="700" fill="#F8FAFC">PostgreSQL + pgvector</text>
    <text x="352" y="882" text-anchor="middle" font-size="11" fill="#94A3B8">agent state · memory · vectors (HA)</text>

    <rect x="565" y="842" width="385" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="757" y="863" text-anchor="middle" font-size="14.5" font-weight="700" fill="#F8FAFC">Valkey</text>
    <text x="757" y="882" text-anchor="middle" font-size="11" fill="#94A3B8">session state · hot cache</text>

    <rect x="970" y="842" width="385" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="1162" y="863" text-anchor="middle" font-size="14.5" font-weight="700" fill="#F8FAFC">MinIO (S3)</text>
    <text x="1162" y="882" text-anchor="middle" font-size="11" fill="#94A3B8">docs · weights · backups</text>

    <rect x="1375" y="842" width="385" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="1567" y="863" text-anchor="middle" font-size="14.5" font-weight="700" fill="#F8FAFC">Harbor</text>
    <text x="1567" y="882" text-anchor="middle" font-size="11" fill="#94A3B8">images · model artifacts</text>
  </g>

  <!-- Footer: portability -->
  <rect x="120" y="928" width="1680" height="96" rx="16" fill="#082F49" stroke="#22D3EE" stroke-width="2"/>
  <text x="960" y="968" text-anchor="middle" font-size="21" font-weight="800" fill="#22D3EE">AKS today  ⇄  bare-metal Kubernetes on-prem — same manifests, overlay swap, zero code changes</text>
  <text x="960" y="1000" text-anchor="middle" font-size="14" fill="#94A3B8">Argo CD GitOps · OpenTelemetry · Vault · KEDA · Cilium · GPU Operator — the portable “thin waist”</text>
</svg>
